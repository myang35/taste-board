<div
  class="bg-background/95 supports-[backdrop-filter]:bg-background/60 border-b backdrop-blur"
>
  <div
    class="container mx-auto flex items-center justify-between gap-4 px-4 py-2"
  >
    <a href="/" class="text-xl font-bold">
      <img src="/logo-title.png" alt="logo" class="h-8" />
    </a>
    <div class="flex items-center gap-4">
      <a
        href="/"
        class="hover:bg-accent hover:text-accent-foreground rounded-lg px-3 py-1.5 text-sm font-medium transition"
        >Home</a
      >
      <a
        href="/browse"
        class="hover:bg-accent hover:text-accent-foreground rounded-lg px-3 py-1.5 text-sm font-medium transition"
        >Browse</a
      >
      <a
        href="/create"
        class="hover:bg-accent hover:text-accent-foreground inline-flex items-center rounded-lg px-3 py-1.5 text-sm font-medium transition"
        ><mat-icon fontIcon="add" class="scale-75"></mat-icon>Create</a
      >
    </div>
    <div>
      @if (user(); as user) {
        <button
          [cdkMenuTriggerFor]="accountMenu"
          class="inline rounded px-3 py-2 transition hover:bg-black/10 aria-expanded:bg-black/10"
        >
          {{ user.name }}
        </button>
        <ng-template #accountMenu>
          <div
            cdkMenu
            class="bg-light-500 flex w-full flex-col gap-2 rounded p-2 shadow shadow-black/50"
          >
            <a
              href="/account/recipes"
              cdkMenuItem
              class="flex items-center gap-2 rounded px-3 py-2 text-start transition hover:bg-black/10"
            >
              <mat-icon
                aria-hidden="false"
                aria-label="Recipes icon"
                fontIcon="menu_book"
                class="scale-75"
              ></mat-icon>
              Recipes
            </a>
            <a
              href="/account/security"
              cdkMenuItem
              class="flex items-center gap-2 rounded px-3 py-2 text-start transition hover:bg-black/10"
            >
              <mat-icon
                aria-hidden="false"
                aria-label="Security icon"
                fontIcon="security"
                class="scale-75"
              ></mat-icon>
              Security
            </a>
            <div class="border-dark-500/50 border-b"></div>
            <button
              cdkMenuItem
              (click)="logout()"
              class="flex items-center gap-2 rounded px-3 py-2 transition hover:bg-black/10"
            >
              <mat-icon
                aria-hidden="false"
                aria-label="Logout icon"
                fontIcon="logout"
                class="scale-75"
              ></mat-icon>
              Logout
            </button>
          </div>
        </ng-template>
      } @else {
        <div class="space-x-4">
          <a
            href="/login"
            class="hover:bg-accent hover:text-accent-foreground rounded-lg px-3 py-1.5 text-sm font-medium transition"
            >Login</a
          >
          <a
            href="/sign-up"
            class="hover:bg-accent hover:text-accent-foreground rounded-lg border px-3 py-1.5 text-sm font-medium transition"
            >Signup</a
          >
        </div>
      }
    </div>
  </div>
</div>
