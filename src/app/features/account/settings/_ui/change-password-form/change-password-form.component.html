<div
  class="bg-card text-card-foreground flex flex-col gap-4 rounded-lg border p-4"
>
  <div class="flex items-center gap-2">
    <mat-icon fontIcon="lock"></mat-icon>
    <h3 class="text-2xl font-medium">Password</h3>
  </div>
  <form class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label for="current-password" class="text-sm font-medium"
        >Current Password</label
      >
      <input
        type="text"
        id="current-password"
        placeholder="Enter current password"
        class="rounded-lg border px-3 py-2 text-sm"
      />
    </div>
    <div class="flex flex-col gap-1">
      <label for="new-password" class="text-sm font-medium">New Password</label>
      <input
        type="text"
        id="new-password"
        placeholder="Enter new password"
        class="rounded-lg border px-3 py-2 text-sm"
      />
    </div>
    <div class="flex flex-col gap-1">
      <label for="confirm-new-password" class="text-sm font-medium"
        >Confirm New Password</label
      >
      <input
        type="text"
        id="confirm-new-password"
        placeholder="Enter new password"
        class="rounded-lg border px-3 py-2 text-sm"
      />
    </div>
    <button
      type="button"
      class="bg-primary text-primary-foreground w-full rounded-lg p-2 text-sm font-medium"
    >
      Update Password
    </button>
  </form>
</div>
