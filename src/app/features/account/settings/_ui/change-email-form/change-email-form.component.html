<div
  class="bg-card text-card-foreground flex flex-col gap-4 rounded-lg border p-4"
>
  <div class="flex flex-col">
    <div class="flex items-center gap-2">
      <mat-icon fontIcon="person"></mat-icon>
      <h3 class="text-2xl font-medium">Username</h3>
    </div>
    <p class="text-muted-foreground text-sm">
      Current username: <span class="font-medium">{{ user()?.username }}</span>
    </p>
  </div>
  <form
    [formGroup]="form"
    (ngSubmit)="updateUsername()"
    class="flex flex-col gap-4"
  >
    @if (formErrorMessage()) {
      <p
        class="text-danger bg-danger/10 border-danger/20 flex items-center gap-1 rounded-lg border p-2 text-sm"
      >
        <mat-icon fontIcon="error" class="scale-75"></mat-icon>
        {{ formErrorMessage() }}
      </p>
    }
    <div class="flex flex-col gap-1">
      <label for="email" class="text-sm font-medium">New Username</label>
      <input
        type="text"
        id="username"
        formControlName="newUsername"
        placeholder="Enter new username"
        required
        maxlength="256"
        class="rounded-lg border px-3 py-2 text-sm"
        [class]="{ 'border-danger': inputErrorMessages().newUsername }"
      />
      @if (inputErrorMessages().newUsername) {
        <p class="text-danger flex items-center gap-1 text-sm">
          <mat-icon fontIcon="error" class="scale-75"></mat-icon>
          {{ inputErrorMessages().newUsername }}
        </p>
      }
    </div>
    <div class="flex flex-col gap-1">
      <label for="password" class="text-sm font-medium">Current Password</label>
      <div class="relative">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          id="password"
          formControlName="password"
          placeholder="Enter current password"
          required
          maxlength="256"
          class="w-full rounded-lg border py-2 pr-10 pl-3 text-sm"
          [class]="{ 'border-danger': inputErrorMessages().password }"
        />
        <button
          type="button"
          (click)="showPassword.set(!showPassword())"
          class="hover:bg-accent absolute top-1 right-1 bottom-1 my-auto flex size-8 items-center justify-center rounded-lg"
        >
          <mat-icon
            [fontIcon]="showPassword() ? 'visibility_off' : 'visibility'"
            class="scale-75"
          ></mat-icon>
        </button>
      </div>
      @if (inputErrorMessages().password) {
        <p class="text-danger flex items-center gap-1 text-sm">
          <mat-icon fontIcon="error" class="scale-75"></mat-icon>
          {{ inputErrorMessages().password }}
        </p>
      }
    </div>
    <button
      type="submit"
      class="bg-primary hover:bg-primary/90 text-primary-foreground w-full rounded-lg p-2 text-sm font-medium transition"
    >
      Update Username
    </button>
  </form>
</div>
