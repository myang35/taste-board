@let currentUser = user();

@if (currentUser) {
  <div class="container mx-auto flex flex-col items-center gap-8 p-4">
    <div class="flex items-center gap-4">
      <img
        [src]="currentUser.imgUrl"
        alt="profile"
        (error)="currentUser.imgUrl = '/image-placeholder.svg'"
        class="size-16 rounded-full"
      />
      <div class="flex flex-col">
        <h1 class="text-3xl font-bold">{{ currentUser.name }}</h1>
        <p class="text-muted-foreground">{{ currentUser.email }}</p>
      </div>
    </div>
    <div class="flex w-full gap-4">
      <ul class="w-60">
        <li>
          <app-tab path="recipes">Recipes</app-tab>
        </li>
        <li>
          <app-tab path="settings">Settings</app-tab>
        </li>
      </ul>
      <div class="w-full">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
} @else {
  <p class="text-danger text-center text-2xl font-medium">
    User is not logged in
  </p>
}
