<ng-container [formGroup]="form().root">
  <div formArrayName="instructions" class="flex flex-col gap-4">
    @for (instruction of form().instructions.controls; track instruction) {
      <div [formGroupName]="$index" class="grid grid-cols-12 gap-2">
        <div class="col-span-9 flex flex-col justify-end gap-2">
          <label
            for="instruction-{{ $index }}-description"
            class="text-sm font-medium"
          >
            <div
              class="bg-orange text-orange-foreground inline-flex size-6 items-center justify-center rounded-full"
            >
              {{ $index + 1 }}
            </div>
            Step
          </label>
          <textarea
            id="instruction-{{ $index }}-description"
            formControlName="description"
            rows="3"
            placeholder="Describe this cooking step..."
            required
            max="1024"
            class="rounded-lg border px-3 py-2 text-sm"
          ></textarea>
        </div>
        <div class="col-span-2 flex flex-col justify-end gap-1">
          <label
            for="instruction-{{ $index }}-minutes"
            class="text-sm font-medium"
            >Time (minutes)</label
          >
          <input
            id="instruction-{{ $index }}-minutes"
            type="number"
            formControlName="minutes"
            placeholder="5"
            required
            maxlength="9999"
            class="rounded-lg border px-3 py-2 text-sm"
          />
        </div>
        <div class="flex items-end">
          <button
            type="button"
            (click)="form().removeInstruction($index)"
            class="text-danger hover:bg-danger/10 mb-1 size-8 rounded-full border transition"
          >
            <span class="flex scale-75 items-center justify-center">
              <mat-icon fontIcon="remove"></mat-icon>
            </span>
          </button>
        </div>
      </div>
    }
    <button
      type="button"
      (click)="form().addInstruction()"
      class="flex w-fit items-center gap-1 rounded-lg border px-3 py-2 text-sm font-medium"
    >
      <span class="scale-75">
        <mat-icon fontIcon="add"></mat-icon>
      </span>
      Add Step
    </button>
  </div>
</ng-container>
