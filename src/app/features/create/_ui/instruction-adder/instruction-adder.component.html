<ng-container [formGroup]="form().root">
  <div formArrayName="instructions" class="flex flex-col gap-4">
    @for (instruction of form().instructions.controls; track instruction) {
      <div [formGroupName]="$index" class="grid grid-cols-4 gap-2">
        <div class="col-span-3 flex gap-2">
          <label
            for="instruction-{{ $index }}-description"
            class="py-1 text-sm font-medium"
          >
            <div
              class="bg-orange text-orange-foreground inline-flex size-6 items-center justify-center rounded-full"
            >
              {{ $index + 1 }}
            </div>
          </label>
          <textarea
            id="instruction-{{ $index }}-description"
            formControlName="description"
            rows="3"
            placeholder="Describe this cooking step..."
            required
            max="1024"
            class="w-full rounded-lg border px-3 py-2 text-sm"
          ></textarea>
        </div>
        <div class="flex gap-2">
          <div class="flex w-full flex-col justify-end gap-1">
            <label
              for="instruction-{{ $index }}-minutes"
              class="text-sm font-medium"
              >Minutes
              <span class="text-muted-foreground text-xs italic"
                >(optional)</span
              ></label
            >
            <input
              id="instruction-{{ $index }}-minutes"
              type="number"
              formControlName="minutes"
              placeholder="5"
              required
              maxlength="9999"
              (input)="onMinutesInput($event, $index)"
              class="rounded-lg border px-3 py-2 text-sm"
            />
          </div>
          <div class="flex items-end">
            <button
              type="button"
              (click)="removeInstruction($index)"
              class="text-danger hover:bg-danger/10 mb-1 size-8 rounded-full border transition"
            >
              <span class="flex scale-75 items-center justify-center">
                <mat-icon fontIcon="remove"></mat-icon>
              </span>
            </button>
          </div>
        </div>
      </div>
    }
    <div class="flex items-end justify-between">
      <button
        type="button"
        (click)="addInstruction()"
        class="hover:bg-accent hover:text-accent-foreground flex w-fit items-center gap-1 rounded-lg border px-3 py-2 text-sm font-medium transition"
      >
        <span class="scale-75">
          <mat-icon fontIcon="add"></mat-icon>
        </span>
        Add Step
      </button>
      <p>
        <span class="text-muted-foreground text-sm">Total Time:</span>
        @if (totalMinutes() >= 60) {
          <span class="text-2xl font-medium">
            {{ totalMinutes() | duration: "h" }}</span
          ><span class="text-sm font-medium">h</span>
        }
        <span class="text-2xl font-medium">
          {{ totalMinutes() | duration: "m" }}</span
        ><span class="text-sm font-medium">m</span>
      </p>
    </div>
  </div>
</ng-container>
