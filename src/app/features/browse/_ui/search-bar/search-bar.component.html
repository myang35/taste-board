<form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="relative">
  <input
    type="text"
    placeholder="Search for recipes..."
    formControlName="query"
    class="w-full rounded-lg border py-3 pr-4 pl-10 text-sm"
  />
  <div class="text-muted-foreground">
    <mat-icon
      aria-hidden="false"
      aria-label="Search icon"
      fontIcon="search"
      class="absolute top-0 bottom-0 left-2 my-auto"
    ></mat-icon>
  </div>
</form>
