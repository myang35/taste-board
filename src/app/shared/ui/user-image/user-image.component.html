<div
  class="bg-muted text-muted-foreground flex items-center justify-center overflow-hidden rounded-full border font-extrabold"
  [class]="classProp()"
>
  @if (user().imgUrl) {
    <img
      [src]="user().imgUrl"
      alt="profile"
      (error)="user().imgUrl = '/image-placeholder.svg'"
    />
  } @else {
    <span>{{ user().name[0] }}</span>
  }
</div>
